<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shop</title>
  <style>
    #modalNote strong {
  color: #d4af37;
}

#modalNote em {
  color: #e8eaf0;
  opacity: 0.9;
}

    #modalNote { white-space: pre-line; }

    :root{
      --bg: #0f1115;
      --panel: #171a21;
      --panel2: #1f2430;
      --text: #e8eaf0;
      --muted: #b7bdc9;
      --border: rgba(255,255,255,0.12);
      --shadow: 0 16px 40px rgba(0,0,0,0.45);
      --radius: 14px;
      --accent: #d4af37;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body{
      margin: 0;
      background: radial-gradient(1200px 700px at 40% 0%, #1a1f2b 0%, var(--bg) 60%, #0a0c10 100%);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    .wrap{
      max-width: 980px;
      margin: 0 auto;
      padding: 28px 16px 48px;
    }

    header{
      margin-bottom: 18px;
      padding: 18px 18px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    h1{
      margin: 0 0 6px;
      font-size: 28px;
      letter-spacing: 0.2px;
    }
    .sub{
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .grid{
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-top: 14px;
    }

    details.section{
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    details.section > summary{
      list-style: none;
      cursor: pointer;
      padding: 14px 16px;
      background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      user-select: none;
    }
    details.section > summary::-webkit-details-marker{ display:none; }

    .summary-left{
      display: flex;
      align-items: baseline;
      gap: 10px;
      min-width: 0;
    }

    .section-title{
      font-weight: 700;
      font-size: 16px;
      letter-spacing: 0.2px;
    }

    .section-count{
      font-size: 12px;
      color: var(--muted);
      padding: 2px 8px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: rgba(0,0,0,0.18);
      white-space: nowrap;
    }

    .chev{
      width: 28px;
      height: 28px;
      border-radius: 10px;
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
      background: rgba(0,0,0,0.18);
      flex: 0 0 auto;
    }
    details[open] .chev{
      transform: rotate(180deg);
      transition: transform 180ms ease;
    }
    details:not([open]) .chev{
      transition: transform 180ms ease;
    }

    .items{
      padding: 6px 10px 12px;
    }

    .table{
      width: 100%;
      border-collapse: collapse;
      overflow: hidden;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(0,0,0,0.18);
    }

    .table thead th{
      text-align: left;
      font-size: 12px;
      letter-spacing: 0.6px;
      color: var(--muted);
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      background: rgba(255,255,255,0.03);
    }

    .table tbody td{
      padding: 10px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      font-size: 14px;
    }

    .table tbody tr:last-child td{
      border-bottom: none;
    }

    .item-btn{
      width: 100%;
      text-align: left;
      background: transparent;
      border: none;
      color: var(--text);
      font: inherit;
      padding: 0;
      cursor: pointer;
    }

    .item-btn:hover{
      text-decoration: underline;
      text-decoration-color: rgba(212,175,55,0.7);
    }

    .price{
      text-align: right;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .tag{
      display: inline-block;
      font-size: 11px;
      letter-spacing: 0.4px;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--muted);
      background: rgba(0,0,0,0.18);
      white-space: nowrap;
    }

    /* Modal */
    .modal-backdrop{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.62);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 50;
    }

    .modal{
      width: min(860px, 100%);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .modal-head{
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      background: rgba(255,255,255,0.04);
      border-bottom: 1px solid var(--border);
      gap: 12px;
    }

    .modal-title{
      margin: 0;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.2px;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .close-btn{
      border: 1px solid var(--border);
      background: rgba(0,0,0,0.20);
      color: var(--text);
      border-radius: 10px;
      padding: 8px 10px;
      cursor: pointer;
      font-size: 14px;
    }
    .close-btn:hover{ border-color: rgba(212,175,55,0.7); }

    .modal-body{
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 14px;
      padding: 14px;
      background: var(--panel2);
    }

    .preview{
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      background: rgba(0,0,0,0.18);
    }
    .preview img{
      width: 100%;
      height: auto;
      display: block;
    }

    .info{
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 12px;
      background: rgba(0,0,0,0.18);
    }

    .info-row{
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .info-row:last-child{ border-bottom: none; }

    .label{ color: var(--muted); font-size: 12px; letter-spacing: 0.5px; }
    .value{ font-size: 14px; font-weight: 650; }

    .note{
      margin-top: 10px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    @media (max-width: 780px){
      .modal-body{ grid-template-columns: 1fr; }
    }

    .mute-btn{
  position: fixed;
  right: 14px;
  bottom: 14px;
  width: 42px;
  height: 42px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: rgba(0,0,0,0.22);
  color: var(--text);
  cursor: pointer;
  display: grid;
  place-items: center;
  box-shadow: var(--shadow);
  opacity: 0.75;
}

.mute-btn:hover{
  opacity: 1;
  border-color: rgba(212,175,55,0.7);
}

.mute-btn:active{
  transform: translateY(1px);
}
.admin-input{
  width: 100%;
  padding: 10px 10px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: rgba(0,0,0,0.18);
  color: var(--text);
  outline: none;
}
.admin-input:focus{
  border-color: rgba(212,175,55,0.7);
}
.admin-row{
  display:grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
@media (max-width: 780px){
  .admin-row{ grid-template-columns: 1fr; }
}
.small-muted{ color: var(--muted); font-size: 12px; line-height: 1.35; }
.admin-list{
  max-height: 360px;
  overflow:auto;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px;
  background: rgba(0,0,0,0.18);
}
.admin-item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding: 8px 0;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.admin-item:last-child{ border-bottom:none; }
/* Make ADMIN modals smaller + single-column */
.modal.admin-mode{
  width: min(720px, 96vw);
}

.modal.admin-mode .modal-body{
  grid-template-columns: 1fr;
}

.modal.admin-mode .preview{
  display: none;
}

  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Town Shop</h1>
      <p class="sub">Click a category to open it. Click an item to view details.</p>
     
      <!-- ADMIN (hidden unless ?admin=letmein) -->
<div id="adminBar" style="display:none; margin-top:12px; padding-top:10px; border-top:1px solid rgba(255,255,255,0.12);">
  <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
    <span class="tag">ADMIN MODE</span>
    <button id="adminAddBtn" class="close-btn" type="button">➕ Add Item</button>
    <button id="adminStockBtn" class="close-btn" type="button">📦 Manage Stock</button>
    <span style="color:var(--muted); font-size:12px;">Tip: this mode is only visible with <code>?admin=...</code></span>
  </div>
</div>


    </header>

    <div id="shopGrid" class="grid"></div>
  </div>

  <div id="backdrop" class="modal-backdrop" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <h2 id="modalTitle" class="modal-title">Item</h2>
        <button id="closeBtn" class="close-btn" type="button">Close</button>
      </div>

      <div class="modal-body">
        <div class="preview">
          <img id="modalImg" src="assets/placeholder.png" alt="Item image" />
        </div>

        <div class="info">
          <div class="info-row">
            <div class="label">Category</div>
            <div id="modalCategory" class="value"></div>
          </div>

          <div class="info-row">
            <div class="label">Price</div>
            <div id="modalPrice" class="value"></div>
          </div>

          <div class="info-row">
            <div class="label">Stock</div>
            <div id="modalStock" class="value"></div>
          </div>

          <div class="note" id="modalNote">
            Placeholder image is being used for all items. Replace per-item images later if you want.
          </div>
        </div>
      </div>
    </div>
  </div>
<button id="muteBtn" class="mute-btn" type="button" aria-pressed="false" title="Mute music">
  🔊
</button>

 <script>
  const DEFAULT_IMAGE = "assets/placeholder.png";

  const grid = document.getElementById("shopGrid");
  const backdrop = document.getElementById("backdrop");
  const closeBtn = document.getElementById("closeBtn");

  const modalTitle = document.getElementById("modalTitle");
  const modalImg = document.getElementById("modalImg");
  const modalCategory = document.getElementById("modalCategory");
  const modalPrice = document.getElementById("modalPrice");
  const modalStock = document.getElementById("modalStock");
  const modalNote = document.getElementById("modalNote");

// --- Shop music (autostart on first interaction + mute toggle) ---
const music = new Audio("assets/music/shop.mp3");
music.loop = true;
music.volume = 0.25;

const muteBtn = document.getElementById("muteBtn");
let isMuted = false;

// Optional: remember mute state
try {
  isMuted = localStorage.getItem("shopMuted") === "true";
} catch {}

function updateMuteUI(){
  muteBtn.textContent = isMuted ? "🔇" : "🔊";
  muteBtn.setAttribute("aria-pressed", String(isMuted));
}

function applyMute(){
  music.muted = isMuted;
  updateMuteUI();
}

muteBtn.addEventListener("click", async () => {
  isMuted = !isMuted;
  try { localStorage.setItem("shopMuted", String(isMuted)); } catch {}
  applyMute();

  // If they unmute and music hasn’t started yet, try starting it now
  if (!isMuted && music.paused) {
    try { await music.play(); } catch {}
  }
});

applyMute();

// Closest possible to autoplay: start immediately after first interaction
let musicStarted = false;

async function startMusicOnFirstInteraction() {
  if (musicStarted) return;
  if (isMuted) return; // don’t start if muted

  try {
    await music.play();
    musicStarted = true;
  } catch {
    musicStarted = false;
  }
}

["click", "keydown", "touchstart"].forEach(evt => {
  document.addEventListener(evt, startMusicOnFirstInteraction, { once: true });
});




  function formatText(str) {
  return str
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/\*(.+?)\*/g, "<em>$1</em>");
}

  function formatGold(n){
    return `${n} gp`;
  }

  function closeModal(){
  const modalEl = backdrop.querySelector(".modal");
  modalEl.classList.remove("admin-mode"); // ✅ back to normal
  backdrop.style.display = "none";
  backdrop.setAttribute("aria-hidden", "true");
}


  async function loadItemDesc(itemId){
    // Each item uses: data/items/<id>.json
    const url = `data/items/${itemId}.json`;
    try {
      const res = await fetch(url, { cache: "no-store" });
      if (!res.ok) return null;
      const data = await res.json();
      return data.desc || null;
    } catch {
      return null;
    }
  }

  async function openModal(categoryName, item){
    modalTitle.textContent = item.name;
    modalCategory.textContent = categoryName;
    modalPrice.textContent = formatGold(item.price);
    modalStock.textContent = item.inStock ? "In stock" : "Out of stock";
    modalImg.src = item.img || DEFAULT_IMAGE;

    modalNote.textContent = "Loading description...";
    const desc = await loadItemDesc(item.id);
if (Array.isArray(desc)) {
modalNote.innerHTML = desc
  .map(p => formatText(p))
  .join("<br><br>");

} else {
  modalNote.textContent = desc || "No description file found for this item.";
}

    backdrop.style.display = "flex";
    backdrop.setAttribute("aria-hidden", "false");
    closeBtn.focus();
  }

  function render(sections){
    grid.innerHTML = "";

    sections.forEach(section => {
      // Only include items that are in stock
      const inStockItems = (section.items || []).filter(i => i && i.inStock);

      // If a whole section has zero in-stock items, we can hide it completely.
      // If you want empty sections visible, remove this if-block.
      if (inStockItems.length === 0) return;

      const details = document.createElement("details");
      details.className = "section";

      const summary = document.createElement("summary");

      const left = document.createElement("div");
      left.className = "summary-left";

      const title = document.createElement("div");
      title.className = "section-title";
      title.textContent = section.name;

      const count = document.createElement("div");
      count.className = "section-count";
      count.textContent = `${inStockItems.length} items`;

      const tag = document.createElement("span");
      tag.className = "tag";
      tag.textContent = section.tag;

      left.appendChild(title);
      left.appendChild(count);
     // left.appendChild(tag);

      const chev = document.createElement("div");
      chev.className = "chev";
      chev.innerHTML = `
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      `;

      summary.appendChild(left);
      summary.appendChild(chev);

      const itemsWrap = document.createElement("div");
      itemsWrap.className = "items";

      const table = document.createElement("table");
      table.className = "table";

      const thead = document.createElement("thead");
      thead.innerHTML = `
        <tr>
          <th>Item</th>
          <th class="price">Price</th>
        </tr>
      `;

      const tbody = document.createElement("tbody");

      inStockItems.forEach(item => {
        const tr = document.createElement("tr");

        const tdName = document.createElement("td");
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "item-btn";
        btn.textContent = item.name;
        btn.addEventListener("click", () => openModal(section.name, item));
        tdName.appendChild(btn);

        const tdPrice = document.createElement("td");
        tdPrice.className = "price";
        tdPrice.textContent = formatGold(item.price);

        tr.appendChild(tdName);
        tr.appendChild(tdPrice);
        tbody.appendChild(tr);
      });

      table.appendChild(thead);
      table.appendChild(tbody);
      itemsWrap.appendChild(table);

      details.appendChild(summary);
      details.appendChild(itemsWrap);

      grid.appendChild(details);
    });
  }

  async function init(){
    try {
      const res = await fetch("data/shop-stock.json", { cache: "no-store" });
      const data = await res.json();
      render(data.sections || []);
    } catch (e) {
      grid.innerHTML = "<p style='color:#ffb4b4'>Failed to load shop-stock.json</p>";
      console.error(e);
    }
  }

  backdrop.addEventListener("click", (e) => {
    if (e.target === backdrop) closeModal();
  });

  closeBtn.addEventListener("click", closeModal);

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && backdrop.style.display === "flex") closeModal();
  });


  // =======================
// ADMIN MODE (hidden)
// Unlock by visiting: shop.html?admin=letmein
// =======================
const ADMIN_CODE = "letmein"; // <- change this to something only you know

let shopData = null; // will hold the loaded JSON so admin can edit it

function isAdminUnlocked(){
  const params = new URLSearchParams(location.search);
  return params.get("admin") === ADMIN_CODE;
}

function downloadTextFile(filename, text, mime="application/json"){
  const blob = new Blob([text], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function slugifyId(name){
  return name
    .toLowerCase()
    .trim()
    .replace(/['"]/g, "")
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-+|-+$/g, "");
}

function ensureUniqueId(baseId, sections){
  let id = baseId || "new-item";
  const used = new Set();
  (sections || []).forEach(s => (s.items || []).forEach(i => used.add(i.id)));
  if (!used.has(id)) return id;
  let n = 2;
  while (used.has(`${id}-${n}`)) n++;
  return `${id}-${n}`;
}

function getSectionByName(name){
  return (shopData.sections || []).find(s => s.name === name) || null;
}

function showAdminBar(){
  const adminBar = document.getElementById("adminBar");
  if (!adminBar) return;
  adminBar.style.display = "block";

  document.getElementById("adminAddBtn").addEventListener("click", openAdminAddModal);
  document.getElementById("adminStockBtn").addEventListener("click", openAdminStockModal);
}

function openAdminModal(title, html){
  const modalEl = backdrop.querySelector(".modal");
  modalEl.classList.add("admin-mode"); // ✅ shrink + 1-column

  modalTitle.textContent = title;
  modalImg.src = DEFAULT_IMAGE;
  modalCategory.textContent = "";
  modalPrice.textContent = "";
  modalStock.textContent = "";
  modalNote.innerHTML = html;

  backdrop.style.display = "flex";
  backdrop.setAttribute("aria-hidden", "false");
  closeBtn.focus();
}


function openAdminAddModal(){
  const sectionOptions = (shopData.sections || [])
    .map(s => `<option value="${s.name}">${s.name}</option>`)
    .join("");

  openAdminModal("Admin: Add Item", `
    <div class="small-muted" style="margin-bottom:10px;">
      This will generate downloads for <b>data/shop-stock.json</b> and <b>data/items/&lt;id&gt;.json</b>.
      Then you drag them into your repo and push.
    </div>

    <div class="admin-row">
      <div>
        <div class="label">Item Name</div>
        <input id="a_name" class="admin-input" placeholder="Cloak of Billowing" />
      </div>
      <div>
        <div class="label">Price (gp)</div>
        <input id="a_price" class="admin-input" type="number" min="0" step="1" placeholder="50" />
      </div>
    </div>

    <div class="admin-row" style="margin-top:10px;">
      <div>
        <div class="label">Category</div>
        <select id="a_section" class="admin-input">${sectionOptions}</select>
      </div>
      <div>
        <div class="label">In Stock?</div>
        <label style="display:flex; gap:10px; align-items:center; margin-top:6px;">
          <input id="a_instock" type="checkbox" checked />
          <span class="value">Yes</span>
        </label>
      </div>
    </div>

    <div style="margin-top:10px;">
      <div class="label">Image path (relative)</div>
      <input id="a_img" class="admin-input" placeholder="assets/items/My Item.png" />
      <div class="small-muted" style="margin-top:6px;">
        Put the actual image in your repo at that path. Your current items use <code>assets/items/...</code>. :contentReference[oaicite:3]{index=3}
      </div>
    </div>

    <div style="margin-top:10px;">
      <div class="label">Description (separate paragraphs with blank lines)</div>
      <textarea id="a_desc" class="admin-input" rows="8" placeholder="First paragraph...

Second paragraph..."></textarea>
      <div class="small-muted" style="margin-top:6px;">
        This becomes <code>data/items/&lt;id&gt;.json</code> (your shop loads it when you click the item). :contentReference[oaicite:4]{index=4}
      </div>
    </div>

    <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:12px;">
      <button id="a_generate" class="close-btn" type="button">Generate Downloads</button>
    </div>

    <div id="a_result" class="small-muted" style="margin-top:10px;"></div>
  `);

  document.getElementById("a_generate").addEventListener("click", () => {
    const name = document.getElementById("a_name").value.trim();
    const price = Number(document.getElementById("a_price").value);
    const sectionName = document.getElementById("a_section").value;
    const inStock = document.getElementById("a_instock").checked;
    const img = document.getElementById("a_img").value.trim();
    const descRaw = document.getElementById("a_desc").value;

    const result = document.getElementById("a_result");

    if (!name) { result.textContent = "❌ Please enter a name."; return; }
    if (!Number.isFinite(price) || price < 0) { result.textContent = "❌ Please enter a valid price."; return; }

    const baseId = slugifyId(name);
    const id = ensureUniqueId(baseId, shopData.sections);

    const section = getSectionByName(sectionName);
    if (!section) { result.textContent = "❌ Could not find that category."; return; }
    if (!Array.isArray(section.items)) section.items = [];

    const newItem = {
      id,
      name,
      price,
      inStock,
      img: img || DEFAULT_IMAGE
    };

    section.items.push(newItem);

    // Build description JSON file (array of paragraphs)
    const paragraphs = descRaw
      .split(/\n\s*\n/g)
      .map(s => s.trim())
      .filter(Boolean);

    const itemDescJson = JSON.stringify({ desc: paragraphs.length ? paragraphs : ["(No description yet.)"] }, null, 2);

    // Download updated shop-stock.json
    const shopJson = JSON.stringify(shopData, null, 2);
    downloadTextFile("shop-stock.json", shopJson);

    // Download item description file
    downloadTextFile(`${id}.json`, itemDescJson);

    result.innerHTML = `
      ✅ Downloads started.<br>
      1) Replace <b>data/shop-stock.json</b> with the downloaded <b>shop-stock.json</b><br>
      2) Save the downloaded <b>${id}.json</b> into <b>data/items/</b><br>
      3) Put your image file in <b>${(img || DEFAULT_IMAGE)}</b> (or update the path)<br>
      Then commit + push.
    `;
  });
}

function openAdminStockModal(){
  // Build a flat list of all items
  const items = [];
  (shopData.sections || []).forEach(section => {
    (section.items || []).forEach(item => {
      items.push({ section: section.name, item });
    });
  });

  const rows = items.map(({section, item}) => `
    <div class="admin-item">
      <div style="min-width:0;">
        <div class="value" style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${item.name}</div>
        <div class="small-muted">${section} • <code>${item.id}</code></div>
      </div>
      <button class="close-btn" type="button" data-toggle-id="${item.id}">
        ${item.inStock ? "Mark Out of Stock" : "Mark In Stock"}
      </button>
    </div>
  `).join("");

  openAdminModal("Admin: Manage Stock", `
    <div class="small-muted" style="margin-bottom:10px;">
      Toggle stock status, then download an updated <b>shop-stock.json</b>.
      (Your page already hides out-of-stock items.) :contentReference[oaicite:5]{index=5}
    </div>

    <div class="admin-list">${rows || "<div class='small-muted'>(No items found.)</div>"}</div>

    <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:12px;">
      <button id="s_download" class="close-btn" type="button">Download Updated shop-stock.json</button>
    </div>

    <div id="s_result" class="small-muted" style="margin-top:10px;"></div>
  `);

  // Toggle handlers
  document.querySelectorAll("[data-toggle-id]").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = btn.getAttribute("data-toggle-id");
      let found = null;
      (shopData.sections || []).forEach(section => {
        (section.items || []).forEach(item => {
          if (item.id === id) found = item;
        });
      });
      if (!found) return;

      found.inStock = !found.inStock;
      btn.textContent = found.inStock ? "Mark Out of Stock" : "Mark In Stock";
      document.getElementById("s_result").textContent = `✅ Updated ${found.name} → ${found.inStock ? "In stock" : "Out of stock"}`;
    });
  });

  document.getElementById("s_download").addEventListener("click", () => {
    const shopJson = JSON.stringify(shopData, null, 2);
    downloadTextFile("shop-stock.json", shopJson);
    document.getElementById("s_result").textContent = "✅ Download started. Replace data/shop-stock.json and push.";
  });
}

// Hook into your existing init() so we can keep a copy of the JSON for admin editing
const _origInit = init;
init = async function(){
  try {
    const res = await fetch("data/shop-stock.json", { cache: "no-store" });
    shopData = await res.json();

    // Normal render
    render(shopData.sections || []);

    // Admin bar
    if (isAdminUnlocked()){
      showAdminBar();
    }
  } catch (e) {
    grid.innerHTML = "<p style='color:#ffb4b4'>Failed to load shop-stock.json</p>";
    console.error(e);
  }
};
  init();

</script>
